version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Leave new releases two weeks to be found out before proposing them.
    cooldown:
      default-days: 14
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
