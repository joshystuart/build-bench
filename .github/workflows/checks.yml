name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv sync --locked
      - run: uv run sh -c 'ruff check . && ruff format --check . && pytest -q'
