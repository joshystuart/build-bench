# TypeScript and JavaScript.
test_paths:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  - "**/*.test.mjs"
  - "**/*.test.cjs"
  - "**/__tests__/**"
  - "test/**"
  - "tests/**"
  - "e2e/**"
ignore_paths:
  - "**/package-lock.json"
  - "**/pnpm-lock.yaml"
  - "**/yarn.lock"
  - "**/bun.lockb"
  - "**/*.snap"
  - "**/node_modules/**"
  - "**/dist/**"
