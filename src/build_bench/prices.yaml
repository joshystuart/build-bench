# US dollars per million tokens, Anthropic first-party API list prices
# (checked 2026-11-11). Cache writes default to 1.25x input (5-minute) and
# 2x input (1-hour); cache reads default to 0.1x input. Override any model,
# or add one, with `prices:` in the settings file. A model id matches the
# longest key it starts with.
claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.25}
claude-mythos-5-1: {input: 10.0, output: 50.0, cache_read: 0.25}
claude-fable-5: {input: 10.0, output: 50.0}
claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20}
claude-opus-5: {input: 5.0, output: 25.0}
claude-opus-4-8: {input: 5.0, output: 25.0}
claude-opus-4-7: {input: 5.0, output: 25.0}
claude-opus-4-6: {input: 5.0, output: 25.0}
claude-sonnet-5-5: {input: 2.0, output: 10.0}
claude-sonnet-5: {input: 2.0, output: 10.0}
claude-sonnet-4-6: {input: 3.0, output: 15.0}
# Haiku 5.5 rises to $0.50/$2.50 for prompts over 100K tokens; this table has
# one rate per model, so override it if your Trials send long prompts.
claude-haiku-5-5: {input: 0.10, output: 0.50}
claude-haiku-4-5: {input: 1.0, output: 5.0}
